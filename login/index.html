<!DOCTYPE html>
<html>

<head>

<title>Login - Maru Manhwa</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}


body{

background:#0f0f0f;

color:white;

font-family:Arial;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

position:relative;

}

.box{

background:#1a1a1a;

width:90%;

max-width:350px;

padding:25px;

border-radius:15px;

overflow:hidden;

}


h2{

text-align:center;
color:#ff2e63;

margin-bottom:20px;

}


input{

width:100%;

padding:12px;

margin-bottom:12px;

background:#0f0f0f;

border:1px solid #333;

color:white;

border-radius:8px;

font-size:15px;

display:block;

}

button{

width:100%;

padding:12px;

background:#ff2e63;

border:none;

border-radius:8px;

color:white;

cursor:pointer;

font-weight:bold;

}



.switch{

text-align:center;

margin-top:15px;

color:#ff2e63;

cursor:pointer;

text-decoration:underline;

}



.back{

display:block;

text-align:center;

margin-top:15px;

color:#888;

text-decoration:none;

}


.hidden{

display:none;

}
  /* Background decoration */

body::before,
body::after{

content:"";

position:absolute;

width:300px;
height:300px;

background:#ff2e63;

border-radius:50%;

filter:blur(120px);

opacity:.25;

z-index:-1;

}


body::before{

top:-100px;
left:-100px;

}


body::after{

bottom:-100px;
right:-100px;

}



.bg-circle{

position:absolute;

border-radius:50%;

border:2px solid rgba(255,46,99,.15);

animation:float 8s infinite ease-in-out;

z-index:-1;

}



.circle1{

width:250px;
height:250px;

top:10%;
right:10%;

}



.circle2{

width:180px;
height:180px;

bottom:15%;
left:10%;

animation-delay:2s;

}



@keyframes float{

0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-30px);

}

}

@media (max-width:600px){

    .box{
        width:92%;
        max-width:400px;
        padding:25px;
    }


    h2{
        font-size:24px;
    }


    input{
        font-size:16px;
        padding:14px;
    }


    button{
        padding:14px;
        font-size:16px;
    }

}
  
</style>

</head>



<body>

  <div class="bg-circle circle1"></div>

<div class="bg-circle circle2"></div>

<div class="box">


<h2>
MARU MANHWA
</h2>



<input 
id="username"
class="hidden"
placeholder="Username">



<input 
id="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Password">

<p 
id="forgotPassword"
class="switch"
onclick="forgotPassword()">

Forgot password?

</p>

<button 
id="mainBtn"
onclick="loginUser()">

Login

</button>



<p 
id="switchText"
class="switch"
onclick="changeMode()">

Don't have an account? Create now

</p>



<a class="back" href="../home">
Back Home
</a>



</div>




<script type="module" src="../js/auth.js"></script>



<script>


let registerMode=false;



function changeMode(){


registerMode=!registerMode;



let username =
document.getElementById("username");


let button =
document.getElementById("mainBtn");


let text =
document.getElementById("switchText");



if(registerMode){


username.classList.remove("hidden");


button.innerText="Create Account";


button.onclick=registerUser;

document.getElementById("forgotPassword").classList.add("hidden");

text.innerText=
"Already have an account? Login";



}else{


username.classList.add("hidden");


button.innerText="Login";


button.onclick=loginUser;

document.getElementById("forgotPassword").classList.remove("hidden");

text.innerText=
"Don't have an account? Create now";


}



}



</script>


</body>

</html>
