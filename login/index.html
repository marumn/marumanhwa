<!DOCTYPE html>
<html>

<head>

<title>Login - Maru Manhwa</title>


<style>

*{
box-sizing:border-box;
}


body{

background:#0f0f0f;
color:white;
font-family:Arial;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}


.box{

background:#1a1a1a;

width:90%;
max-width:350px;

padding:25px;

border-radius:15px;

}


h2{

text-align:center;
color:#ff2e63;

margin-bottom:20px;

}


input{

width:100%;

padding:12px;

margin-bottom:12px;

background:#0f0f0f;

border:1px solid #333;

color:white;

border-radius:8px;

font-size:15px;

}


button{

width:100%;

padding:12px;

background:#ff2e63;

border:none;

border-radius:8px;

color:white;

cursor:pointer;

font-weight:bold;

}



.switch{

text-align:center;

margin-top:15px;

color:#ff2e63;

cursor:pointer;

text-decoration:underline;

}



.back{

display:block;

text-align:center;

margin-top:15px;

color:#888;

text-decoration:none;

}


.hidden{

display:none;

}


</style>

</head>



<body>


<div class="box">


<h2>
MARU MANHWA
</h2>



<input 
id="username"
class="hidden"
placeholder="Username">



<input 
id="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Password">



<button 
id="mainBtn"
onclick="loginUser()">

Login

</button>



<p 
id="switchText"
class="switch"
onclick="changeMode()">

Don't have an account? Create now

</p>



<a class="back" href="../home">
Back Home
</a>



</div>




<script type="module" src="../js/auth.js"></script>



<script>


let registerMode=false;



function changeMode(){


registerMode=!registerMode;



let username =
document.getElementById("username");


let button =
document.getElementById("mainBtn");


let text =
document.getElementById("switchText");



if(registerMode){


username.classList.remove("hidden");


button.innerText="Create Account";


button.onclick=registerUser;



text.innerText=
"Already have an account? Login";



}else{


username.classList.add("hidden");


button.innerText="Login";


button.onclick=loginUser;



text.innerText=
"Don't have an account? Create now";


}



}



</script>


</body>

</html>
